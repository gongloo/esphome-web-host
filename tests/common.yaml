esphome:
  name: web-host-test
  project:
    name: gongloo.web-host-test
    version: "1.2.3"

external_components:
  - source:
      type: local
      path: ../components
    components: [web_host, pwa_host]

wifi:
  ssid: "TestSSID"
  password: "TestPassword"

logger:

web_server:
  local: true

packages:
  pkg_assets: !include packages/pkg_web_host.yaml

web_host:
  - source: "fixtures"
    minify: true
    files:
      - id: web_index
        file: "index.html"
        url: "/"
      - id: web_js
        file: "app.js"
        url: "/app.js"
        cache_control: "no-cache"
      - id: web_manifest
        file: "manifest.webmanifest"
        url: "/manifest.webmanifest"
      - id: web_config_json
        file: "config.json"
        url: "/config.json"
      - id: web_raw_json
        file: "raw.json"
        url: "/raw.json"
        minify: false
      - id: web_tiny_bin
        file: "tiny.bin"
        url: "/tiny.bin"
  - source:
      type: local
      path: "fixtures"
    minify: false
    cache_control: "public, max-age=3600"
    files:
      - id: web_override_minify_on
        file: "config.json"
        url: "/config-min.json"
        minify: true

pwa_host:
  - id: test_pwa
    base_path: "/pwa"
    name: "Web Host Test PWA"
    theme_color: "#0c0c0e"
    background_color: "#0c0c0e"
    sources:
      - source: "fixtures"
        files:
          - id: pwa_index
            file: "index.html"
            url: "app.html"
            aliases: ["index.html"]
          - id: pwa_css
            file: "styles.css"
            url: "styles.css"
            strategy: stale_while_revalidate
      - source:
          type: local
          path: "fixtures"
        minify: false
        files:
          - id: pwa_js
            file: "app.js"
            url: "app.js"
            strategy: cache_first
